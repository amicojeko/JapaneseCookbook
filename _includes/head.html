<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="{{ url }}/manifest.json">
  <link rel="apple-touch-icon" sizes="128x128" href="/assets/images/icon_128.png">
  <link rel="icon" sizes="192x192" href="/assets/images/icon_192.png">
  <link rel="icon" type="image/png" href="/assets/images/icon_32.png">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">

  <script>
    if ("serviceWorker" in navigator) {
      if (navigator.serviceWorker.controller) {
        console.log("An active service worker found, no need to register");
      } else {
        // Register the service worker
        navigator.serviceWorker
          .register("{{ site.baseurl }}/serviceworker.js", {
            scope: "./"
          })
          .then(function (reg) {
            console.log("Service worker has been registered for scope: " + reg.scope);
          });
      }
    }
  </script>
</head>
